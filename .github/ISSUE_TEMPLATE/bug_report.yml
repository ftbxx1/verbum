name: Bug report
description: Something in Verbum doesn't behave the way the sentence implies
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the behaviour you saw.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: Verbum script (if relevant)
      description: Paste the `.vb` / `.mcscript` file that misbehaves.
      render: vb
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - "Live Paper server"
        - "Offline demo (verbum-engine jar)"
        - "Both"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Paper version, logs, anything else useful.
